<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три тарані</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Три тарані">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* екран ділиться з системою: зверху біла смуга статусу, знизу біле тло — як у звичайному Safari */
  /* знизу залишаємо трохи білого місця під іконками меню: змініть 14px, щоб додати або зменшити */
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 14px); border: 0; background: #f4f6f4; }
  #msg { margin: 24px; padding: 16px; background: #fff; border-radius: 12px; color: #111; font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<iframe id="app" title="АФК «Три тарані»" allow="clipboard-write"></iframe>
<script>
  // Посилання на застосунок (закінчується на /exec)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxoGGCTXgSRJ33S9NRZ5L9JJQWNL-4tAXLnHh2zDRswPU90ANRFsy92PlxUO1Maybw/exec';
  var f = document.getElementById('app');
  if (/^https:\/\/script\.google\.com\/\S+$/.test(EXEC_URL) || /^file:/.test(EXEC_URL)) f.src = EXEC_URL;
  else { f.remove(); document.body.insertAdjacentHTML('afterbegin', '<div id="msg">Відкрийте файл index.html і вставте в EXEC_URL посилання на застосунок (https://script.google.com/macros/s/…/exec).</div>'); }
</script>
</body>
</html>
