<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* екран ділиться з системою: зверху біла смуга статусу, знизу біле тло — як у звичайному Safari */
  /* знизу залишаємо трохи білого місця під іконками меню: змініть 14px, щоб додати або зменшити */
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 14px); border: 0; background: #f4f6f4; opacity: 0; transition: opacity .15s ease; }
  iframe.on { opacity: 1; }
  /* заставка з логотипом: видно, поки застосунок завантажується */
  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; transition: opacity .15s ease; }
  #splash img { width: 30vmin; max-width: 160px; min-width: 96px; height: auto; border-radius: 22%; animation: pulse 1.4s ease-in-out infinite; }
  #splash.off { opacity: 0; pointer-events: none; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .8; } }
  #msg { margin: 24px; padding: 16px; background: #fff; border-radius: 12px; color: #111; font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""></div>
<iframe id="app" title="АФК «Три тарані»" allow="clipboard-write; web-share"></iframe>
<script>
  // Посилання на застосунок (закінчується на /exec)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxoGGCTXgSRJ33S9NRZ5L9JJQWNL-4tAXLnHh2zDRswPU90ANRFsy92PlxUO1Maybw/exec';
  var f = document.getElementById('app');
  if (/^https:\/\/script\.google\.com\/\S+$/.test(EXEC_URL) || /^file:/.test(EXEC_URL)) f.src = EXEC_URL;
  else { f.remove(); document.body.insertAdjacentHTML('afterbegin', '<div id="msg">Відкрийте файл index.html і вставте в EXEC_URL посилання на застосунок (https://script.google.com/macros/s/…/exec).</div>'); }
  // показуємо застосунок, коли він сам повідомив «готово» (або через 7 секунд про всяк випадок)
  var shown = false;
  function showApp() { if (shown) return; shown = true; f.classList.add('on'); var s = document.getElementById('splash'); if (s) { s.classList.add('off'); setTimeout(function () { s.remove(); }, 250); } }
  setTimeout(showApp, 7000);
  var lastReload = 0;
  // застосунок може попросити перезавантажити себе, якщо сесія Google після сну телефона протухла
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d) return;
    if (d.afk === 'ready') { showApp(); return; }
    if (d.afk === 'reload') {
      if (Date.now() - lastReload < 30000 || !f.parentNode) return;
      lastReload = Date.now(); shown = false; f.classList.remove('on'); setTimeout(showApp, 7000); f.src = 'about:blank'; setTimeout(function () { f.src = EXEC_URL; }, 80);
    }
    // «Поділитися»: системне меню iOS відкриваємо звідси, бо у вкладеному вікні Google воно заблоковане
    if (d.afk === 'share' && typeof d.text === 'string') {
      var reply = function (m) { try { e.source.postMessage(m, '*'); } catch (x) { } };
      if (!navigator.share) { reply({ afk: 'share-fail' }); return; }
      reply({ afk: 'share-ack' });
      navigator.share({ text: d.text.slice(0, 5000) }).catch(function (err) { if (!err || err.name !== 'AbortError') reply({ afk: 'share-fail' }); });
    }
  });
</script>
</body>
